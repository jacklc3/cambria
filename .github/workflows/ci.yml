name: CI

# Builds the interpreter and runs the test suite, which covers test/cases and
# every programme in examples/.

on:
  push:
    branches: [main]
    paths:
      - src/**
      - test/**
      - examples/**
      - cambria.cabal
      - .github/workflows/ci.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.6.6', '9.8.4', '9.10.1', '9.12.1']

    name: GHC ${{ matrix.ghc }}
    steps:
      # paper/ is a submodule on a private remote, so leave submodules off.
      - uses: actions/checkout@v7

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}

      # alex and happy are build-tool-depends, so they are built into the store.
      - name: Cache cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('cambria.cabal') }}
          restore-keys: ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Build
        run: cabal build all --enable-tests

      # The harness resolves test/cases and examples/ relative to the package
      # root, which is where cabal test runs.
      - name: Test
        run: cabal test all --test-show-details=direct
